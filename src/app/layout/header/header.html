<header class="whm-header" [class.whm-header--scrolled]="scrolled()">
  <div class="whm-header__bar wh-container">
    <a routerLink="/" class="whm-header__brand" (click)="closeMenu()">
      <img src="logo.png" alt="{{ company.name }}" class="whm-header__logo" width="40" height="40" />
      <span class="whm-header__name">
        <strong>Western Hardware Mart</strong>
        <small>{{ company.tagline }}</small>
      </span>
    </a>

    <button
      type="button"
      class="whm-header__toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="whm-primary-nav"
      aria-label="Toggle navigation menu"
    >
      <span></span><span></span><span></span>
    </button>

    <nav id="whm-primary-nav" class="whm-header__nav" [class.whm-header__nav--open]="menuOpen()">
      <a routerLink="/products" routerLinkActive="whm-header__nav-link--active" (click)="closeMenu()">Products</a>
      <a routerLink="/categories" routerLinkActive="whm-header__nav-link--active" (click)="closeMenu()">Categories</a>
      <a routerLink="/about" routerLinkActive="whm-header__nav-link--active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">About Us</a>
      <a routerLink="/contact" routerLinkActive="whm-header__nav-link--active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Contact</a>
      <a href="tel:919874636636" class="whm-header__phone" aria-label="Call Western Hardware Mart at +91 98746 36636">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path
      d="M22 16.92v3a2 2 0 0 1-2.18 2
      19.79 19.79 0 0 1-8.63-3.07
      19.5 19.5 0 0 1-6-6
      19.79 19.79 0 0 1-3.07-8.67
      A2 2 0 0 1 4.11 2h3
      a2 2 0 0 1 2 1.72
      12.84 12.84 0 0 0 .7 2.81
      2 2 0 0 1-.45 2.11L8.09 9.91
      a16 16 0 0 0 6 6l1.27-1.27
      a2 2 0 0 1 2.11-.45
      12.84 12.84 0 0 0 2.81.7
      A2 2 0 0 1 22 16.92z" />
    </svg>

    <span>+91 98746 36636</span>
</a>
      <a class="wh-btn wh-btn--primary whm-header__quote-btn" routerLink="/contact" (click)="closeMenu()">
      
        Get a Quote
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="M7 17 17 7M7 7h10v10"/>
        </svg>
      </a>
    </nav>
  </div>
</header>
