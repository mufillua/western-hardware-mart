@if (totalPages() > 1) {
  <nav class="whm-pagination" aria-label="Pagination">
    <button
      type="button"
      class="whm-pagination__nav"
      [disabled]="currentPage() === 1"
      (click)="go(currentPage() - 1)"
      aria-label="Previous page"
    >
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      <span class="whm-pagination__nav-label">Previous</span>
    </button>

    <ul class="whm-pagination__pages">
      @for (token of pageTokens(); track $index) {
        <li>
          @if (token === '…') {
            <span class="whm-pagination__ellipsis" aria-hidden="true">…</span>
          } @else {
            <button
              type="button"
              class="whm-pagination__page"
              [class.whm-pagination__page--active]="token === currentPage()"
              [attr.aria-current]="token === currentPage() ? 'page' : null"
              (click)="go(token)"
            >
              {{ token }}
            </button>
          }
        </li>
      }
    </ul>

    <button
      type="button"
      class="whm-pagination__nav"
      [disabled]="currentPage() === totalPages()"
      (click)="go(currentPage() + 1)"
      aria-label="Next page"
    >
      <span class="whm-pagination__nav-label">Next</span>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </nav>
}
